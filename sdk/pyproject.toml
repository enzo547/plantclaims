[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plantclaims"
version = "0.1.1"
description = "Python client for PlantClaims: source-grounded claims extracted from plant science papers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.urls]
Homepage = "https://plantclaims.org"
Documentation = "https://plantclaims.org/docs"

[tool.setuptools.packages.find]
where = ["src"]
